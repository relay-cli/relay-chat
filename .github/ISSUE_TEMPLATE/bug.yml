name: Bug report
description: Report reproducible Relay Chat behavior.
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command, input, and smallest model adapter that reproduces the issue.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Relay Chat version, Node.js version, terminal, and operating system.
    validations:
      required: true
